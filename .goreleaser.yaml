version: 2

project_name: awsmgr

before:
  hooks:
    - go mod tidy

builds:
  - id: awsmgr

    main: .

    binary: awsmgr

    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64

    ignore:
      - goos: windows
        goarch: arm64

    flags:
      - -trimpath

    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .Commit }}
        -X main.date={{ .Date }}

archives:
  - id: default

    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

    formats:
      - tar.gz

    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto

brews:
  - name: awsmgr

    repository:
      owner: santhosh-john
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_GITHUB_TOKEN }}"

    directory: Formula

    homepage: "https://github.com/santhosh-john/awsmgr"

    description: "Operational workflow and environment diagnostics tool for AWS engineers."

    license: "MIT"

    commit_author:
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com

    commit_msg_template: "brew: update awsmgr to {{ .Tag }}"

    install: |
      bin.install "awsmgr"

    test: |
      system "#{bin}/awsmgr", "version"
