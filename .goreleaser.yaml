version: 2

project_name: awsmgr

before:
  hooks:
    - git config --global user.email "nimpossible2020@gmail.com"
    - git config --global user.name "Santhosh John"
    - go mod tidy

builds:
  - id: awsmgr
    main: .
    binary: awsmgr
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - arm64
      - amd64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

brews:
  - name: awsmgr
    repository:
      owner: santhosh-john
      name: homebrew-tap
    homepage: https://github.com/santhosh-john/awsmgr
    description: Operational workflow and environment diagnostics tool for AWS engineers.
    license: MIT
    commit_msg_template: "Brew formula update for awsmgr version {{ .Tag }}"
    formula: |
      class Awsmgr < Formula
        desc "Operational workflow and environment diagnostics CLI for AWS engineers"
        homepage "https://github.com/santhosh-john/awsmgr"
        license "MIT"
        version "{{ .Version }}"
        
        if OS.mac?
          if Hardware::CPU.arm?
            url "https://github.com/santhosh-john/awsmgr/releases/download/{{ .Tag }}/awsmgr_{{ .Version }}_darwin_arm64.tar.gz"
            sha256 "{{ index .Checksums "awsmgr_darwin_arm64.tar.gz" }}"
          else
            url "https://github.com/santhosh-john/awsmgr/releases/download/{{ .Tag }}/awsmgr_{{ .Version }}_darwin_amd64.tar.gz"
            sha256 "{{ index .Checksums "awsmgr_darwin_amd64.tar.gz" }}"
          end
        elsif OS.linux?
          if Hardware::CPU.arm?
            url "https://github.com/santhosh-john/awsmgr/releases/download/{{ .Tag }}/awsmgr_{{ .Version }}_linux_arm64.tar.gz"
            sha256 "{{ index .Checksums "awsmgr_linux_arm64.tar.gz" }}"
          else
            url "https://github.com/santhosh-john/awsmgr/releases/download/{{ .Tag }}/awsmgr_{{ .Version }}_linux_amd64.tar.gz"
            sha256 "{{ index .Checksums "awsmgr_linux_amd64.tar.gz" }}"
          end
        end
      
        def install
          bin.install "awsmgr"
        end
      
        def test
          system bin/"awsmgr", "help"
        end
      end

release:
  draft: false
  prerelease: auto

