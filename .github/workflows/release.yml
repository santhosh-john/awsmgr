name: Release Tooling

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Runtime Architecture
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Configure Git for Commits
        run: |
          git config --global user.email "nimpossible2020@gmail.com"
          git config --global user.name "Santhosh John"
          git remote set-url origin https://x-access-token:${{ secrets.HOMEBREW_GITHUB_TOKEN }}@github.com/santhosh-john/awsmgr.git

      - name: Run GoReleaser Execution
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
