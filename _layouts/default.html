<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title }} | {% endif %}awsmgr</title>
  <meta name="description" content="Operational workflow and environment diagnostics CLI for AWS engineers." />

  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}" />
</head>

<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-logo" href="{{ '/' | relative_url }}" aria-label="awsmgr home">
        <img src="{{ '/assets/awsmgr-logo.svg' | relative_url }}" alt="awsmgr" />
      </a>

      <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
        ☰
      </button>

      <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
        <a href="{{ '/install.html' | relative_url }}">Install</a>
        <a href="{{ '/commands.html' | relative_url }}">Commands</a>
        <a href="{{ '/troubleshooting.html' | relative_url }}">Troubleshooting</a>
        <a href="{{ '/development.html' | relative_url }}">Development</a>

        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
          <span class="theme-toggle__icon">◐</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <a class="github-float" href="https://github.com/santhosh-john/awsmgr" target="_blank" rel="noopener"
    aria-label="GitHub Repository">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path
        d="M12 .5C5.648.5.5 5.648.5 12a11.5 11.5 0 0 0 7.863 10.92c.575.104.785-.25.785-.556 0-.274-.01-1-.016-1.962-3.2.695-3.878-1.542-3.878-1.542-.523-1.328-1.277-1.682-1.277-1.682-1.044-.714.079-.699.079-.699 1.154.081 1.761 1.185 1.761 1.185 1.026 1.759 2.692 1.251 3.348.957.104-.744.402-1.252.731-1.54-2.554-.291-5.24-1.277-5.24-5.686 0-1.257.45-2.285 1.185-3.09-.119-.291-.513-1.463.112-3.05 0 0 .966-.309 3.167 1.18a10.98 10.98 0 0 1 5.766 0c2.2-1.489 3.165-1.18 3.165-1.18.627 1.587.233 2.759.114 3.05.737.805 1.183 1.833 1.183 3.09 0 4.42-2.69 5.392-5.252 5.678.413.356.781 1.056.781 2.128 0 1.538-.014 2.778-.014 3.157 0 .309.207.666.79.553A11.502 11.502 0 0 0 23.5 12C23.5 5.648 18.352.5 12 .5Z" />
    </svg>
  </a>

  <footer class="site-footer">
    <div class="site-footer__inner">
      Made with ❤️ by Santhosh John | © {{ site.time | date: '%Y' }}
    </div>
  </footer>

  <script defer>
    const root = document.documentElement;
    const toggle = document.getElementById("theme-toggle");
    const mobileToggle = document.getElementById("mobile-menu-toggle");
    const nav = document.getElementById("site-nav");

    // Theme
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme) {
      root.setAttribute("data-theme", savedTheme);
    } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
      root.setAttribute("data-theme", "dark");
    }

    toggle.addEventListener("click", () => {
      const current =
        root.getAttribute("data-theme") === "dark" ? "light" : "dark";

      root.setAttribute("data-theme", current);
      localStorage.setItem("theme", current);
    });

    // Mobile Menu
    mobileToggle.addEventListener("click", () => {
      nav.classList.toggle("site-nav--open");

      const expanded =
        mobileToggle.getAttribute("aria-expanded") === "true";

      mobileToggle.setAttribute("aria-expanded", !expanded);
    });
  </script>
</body>

</html>
